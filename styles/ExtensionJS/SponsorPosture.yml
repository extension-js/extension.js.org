# Sponsor posture: extension.dev sponsors Extension.js and never owns it.
# The docs may name the sponsor, but no copy may call Extension.js "our
# framework", "our engine", or extension.dev "the company behind
# Extension.js". A personal biography stays legal, so singular "maintainer
# of Extension.js" passes and only the company-voice forms error. The
# association sentence is "Extension.dev sponsors Extension.js, the open
# source framework it builds on."
extends: existence
message: "'%s' claims Extension.js for the company. extension.dev sponsors Extension.js, it does not own it."
level: error
ignorecase: true
tokens:
  - our (own )?(open.source )?framework
  - our (own )?engine
  - our (own )?(open.source )?CLI
  - the (compan(y|ies)|team|people|folks) behind (Extension\.js|the framework)
  - we (maintain|own|run|develop|build|author) Extension\.js
  - the maintainers of Extension\.js
  - Extension\.js,? our\b
  - parent (compan(y|ies) )?of Extension\.js
  - extension\.dev's Extension\.js
  - Extension\.js by extension\.dev
  - flagship
