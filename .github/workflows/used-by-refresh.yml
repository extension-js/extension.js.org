name: Used-by refresh

# Weekly refresh of extension.js.org/docs/used-by.
# - Updates store users, rating, version and GitHub stars for the projects that
#   are already on the page (snippets/used-by.jsx, between @generated markers).
# - Lists new repositories that verifiably build with Extension.js in
#   docs-review/used-by/candidates.md. Nothing is added to the page by the bot.
# Opens or updates one pull request. The repository setting "Allow GitHub
# Actions to create and approve pull requests" must be on.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: used-by-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh stats and find candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/used-by/refresh.mjs --body "$RUNNER_TEMP/used-by-body.md"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/used-by-refresh
          delete-branch: true
          commit-message: Refresh the used-by showcase data
          title: Refresh the used-by showcase
          body-path: ${{ runner.temp }}/used-by-body.md
          add-paths: |
            snippets/used-by.jsx
            docs-review/used-by/candidates.md
