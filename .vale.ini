StylesPath = styles
# The floor every runner sees, this repo's own gate included. The Mintlify check
# on each pull request runs Vale itself, reads this file, and fails on anything
# it reports, so a suggestion floor here turned that check red on every PR and
# taught everyone to merge through it. Suggestions stay one command away,
# `pnpm check:prose`.
MinAlertLevel = error
Vocab = Mintlify

# ExtensionJS = house rules from AGENTS.md.
# STE          = subset of ASD-STE100 chosen for translation safety.
[*.mdx]
BasedOnStyles = ExtensionJS, STE

# The landing page is JSX-heavy and deliberately writes in a different register.
# House voice still applies; the STE sentence caps do not.
[index.mdx]
BasedOnStyles = ExtensionJS

# Blog posts are announcements, not procedures.
[blog/*.mdx]
BasedOnStyles = ExtensionJS

# The zh-Hans and zh-Hant mirrors get none of these rules, because all of them
# are written for English. This used to live in the check:prose command, which
# only covered people who ran that command, while any other runner still linted
# the mirrors. The em dash rule shows the cost best: it reported 144 errors on
# text where a dash is ordinary Chinese punctuation.
# The leading `**/` is load-bearing, do not tidy it away. Vale matches these
# patterns against the path AS THE CALLER GAVE IT, so a bare `zh-Hans/**` only
# matches a run made from the repo root with relative paths. The hosted check
# passes differently rooted paths, where it matched nothing and the mirrors got
# linted anyway. Measured both ways before and after.
[**/zh-Hans/**/*.mdx]
BasedOnStyles =

[**/zh-Hant/**/*.mdx]
BasedOnStyles =
